name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npx vsce package --out mimic.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: mimic-vsix
          path: mimic.vsix
