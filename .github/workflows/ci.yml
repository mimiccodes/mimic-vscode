name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npx vsce package --out mimic.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: mimic-vsix
          path: mimic.vsix
  # What "Install/Update Mimic" does on Windows, with the latest release:
  # unpack with Windows' tar, run install.ps1 under a policy that forbids
  # scripts (bypassed as the extension does), then update over it
  windows-install:
    runs-on: windows-latest
    steps:
      - name: Install the latest Mimic as the extension does, twice
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'mimic-install'
          New-Item -ItemType Directory -Force $dir | Out-Null
          gh release download --repo mimiccodes/mimic --pattern 'mimic-*-windows-x86_64.zip' --dir $dir
          $zip = Get-ChildItem $dir -Filter *.zip | Select-Object -First 1
          & "$env:SystemRoot\System32\tar.exe" -xf $zip.FullName -C $dir
          if ($LASTEXITCODE -ne 0) { throw "tar failed" }
          $script = Join-Path $dir ($zip.BaseName + '\install.ps1')
          if (-not (Test-Path $script)) { throw "no install.ps1 after unpacking" }
          Set-ExecutionPolicy -Scope CurrentUser Restricted -Force
          foreach ($i in 1, 2) {
            powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script
            if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed (run $i)" }
          }
          & "$env:USERPROFILE\.mimic\bin\mimic.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "mimic does not run" }
  # Updating while the language server runs the old mimic (as an open
  # editor does): Linux reports "Text file busy" to a copy over it
  linux-update-while-running:
    runs-on: ubuntu-latest
    steps:
      - name: Install 0.3.13, keep mimic lsp running, update to the latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          get() { mkdir -p "$RUNNER_TEMP/$1"; gh release download $2 --repo mimiccodes/mimic --pattern 'mimic-*-linux-x86_64.tar.gz' --dir "$RUNNER_TEMP/$1"; tar -xzf "$RUNNER_TEMP/$1"/*.tar.gz -C "$RUNNER_TEMP/$1"; }
          get old v0.3.13
          get new ""
          sh "$RUNNER_TEMP"/old/mimic-*/install.sh
          ~/.mimic/bin/mimic --version
          (sleep 300 | ~/.mimic/bin/mimic lsp > /dev/null 2>&1 &)
          sleep 2
          sh "$RUNNER_TEMP"/new/mimic-*/install.sh
          ~/.mimic/bin/mimic --version
